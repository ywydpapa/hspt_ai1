<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSPT 로그인</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
            padding: 40px 32px;
            animation: fadeIn 0.35s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .brand-header {
            text-align: center;
            margin-bottom: 26px;
        }
        .brand-badge {
            display: inline-block;
            background: #eff6ff;
            color: #2563eb;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 1px;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
            border: 1px solid #dbeafe;
        }
        .title {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 14px;
            color: #64748b;
        }
        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fee2e2;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }
        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .form-input {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            font-size: 15px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            transition: all 0.2s;
            background: #f8fafc;
        }
        .form-input:focus {
            background: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }
        .toggle-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            padding: 4px;
        }
        .toggle-btn:hover {
            color: #0f172a;
        }
        .submit-btn {
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.25);
            margin-top: 8px;
        }
        .submit-btn:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.35);
        }
        .sample-box {
            margin-top: 24px;
            padding: 14px;
            background: #f1f5f9;
            border-radius: 10px;
            font-size: 12px;
            color: #475569;
            line-height: 1.6;
        }
        .sample-box code {
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: Consolas, monospace;
            color: #0f172a;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand-header">
            <div class="brand-badge">HSPT AI SYSTEM</div>
            <h1 class="title">HSPT 로그인</h1>
            <p class="subtitle">아이디와 비밀번호를 입력해주세요</p>
        </div>

        {{ERROR_ALERT}}

        <form method="POST" action="/login">
            <div class="form-group">
                <label class="form-label" for="userId">아이디</label>
                <div class="input-wrap">
                    <input class="form-input" type="text" id="userId" name="userId" value="{{USER_ID}}" placeholder="아이디를 입력하세요" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="userPasswd">비밀번호</label>
                <div class="input-wrap">
                    <input class="form-input" type="password" id="userPasswd" name="userPasswd" placeholder="비밀번호를 입력하세요" required>
                    <button type="button" class="toggle-btn" id="togglePw">표시</button>
                </div>
            </div>

            <button type="submit" class="submit-btn">로그인</button>
        </form>

        <div class="sample-box">
            💡 <strong>테스트 샘플 계정</strong><br>
            아이디: <code>djkim</code> &nbsp;|&nbsp; 비밀번호: <code>core2020</code>
        </div>
    </div>

    <script>
        const input = document.getElementById("userPasswd");
        const btn = document.getElementById("togglePw");
        btn.addEventListener("click", function() {
            if (input.type === "password") {
                input.type = "text";
                btn.textContent = "숨김";
            } else {
                input.type = "password";
                btn.textContent = "표시";
            }
        });
    </script>
</body>
</html>
